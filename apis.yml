aid: ai-coustics
name: ai-coustics
description: >-
  ai-coustics is a Berlin-based audio-intelligence company providing a real-time speech-enhancement
  SDK for Voice AI systems. Its Quail, Rook, Quail VAD, Quail Voice Focus, and Tyto models remove
  background noise, isolate the primary speaker, detect voice activity, and score audio risk to make
  automatic speech recognition (ASR) more accurate and voice-activity detection steadier in the real
  world. The SDK runs on the proprietary AirTen CPU-first inference runtime (no GPU, no ONNX
  dependency) with sub-30ms latency, and ships official bindings for Python, Rust, Node.js, C, C++, and
  WebAssembly, plus LiveKit and Pipecat integrations. Authentication uses self-service license keys or
  short-lived JWTs; a legacy REST API was sunset in favor of the SDK. Backed by Partech.
